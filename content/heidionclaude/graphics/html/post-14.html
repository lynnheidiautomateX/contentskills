<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=JetBrains+Mono:wght@400;500&display=swap"><style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px}
body{background:var(--bg);color:var(--ink);font-family:Lexend,sans-serif;position:relative;overflow:hidden}
.top{position:absolute;top:58px;left:96px;right:96px;display:flex;justify-content:space-between;
  font:500 26px Lexend;letter-spacing:.22em;color:var(--lab);text-transform:uppercase}
.wrap{position:absolute;left:96px;right:96px;top:170px;bottom:200px;display:flex;flex-direction:column}
.kick{font:500 28px Lexend;letter-spacing:.2em;text-transform:uppercase;color:var(--lab);margin-bottom:22px}
h1{font-family:Newsreader,serif;font-weight:500;font-size:var(--hs,92px);line-height:1.04;letter-spacing:-.015em;color:var(--ink)}
h1 em{font-style:italic;color:var(--acc);font-weight:400}
.vis{flex:1;position:relative;margin-top:48px}
.foot{position:absolute;left:96px;right:96px;bottom:64px;display:flex;justify-content:space-between;align-items:center}
.url{font:500 32px Lexend;color:var(--ink)}
.pill{font:600 34px Lexend;padding:24px 40px;border-radius:999px;background:var(--acc);color:var(--bg)}
.card{background:var(--card);color:var(--cink);border-radius:22px;box-shadow:0 24px 60px rgba(40,20,40,.18)}
.mono{font-family:'JetBrains Mono',monospace}
.serif{font-family:Newsreader,serif}
.strike{position:relative;display:inline-block}
.strike:after{content:"";position:absolute;left:-6px;right:-6px;top:52%;height:9px;background:#A0466F;transform:rotate(-2deg)}
.chip{display:inline-block;padding:12px 24px;border-radius:999px;font:500 28px Lexend}
.center{display:flex;align-items:center;justify-content:center}
</style></head>
<body style="--bg:#54295A;--ink:#FBF8F2;--acc:#EFDEE2;--lab:#EFDEE2;--card:#FBF8F2;--cink:#1A1816;--line:#D9BE74;--hs:100px">
<div class="top"><span>Heidi on Claude</span><span></span></div>
<div class="wrap"><div class="kick">Myth</div><h1>The first draft <em>isn't supposed to be good.</em></h1><div class="vis">
<div style="position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:34px">
 <div><div style="display:flex;justify-content:space-between;font:500 30px Lexend;color:#FBF8F2;margin-bottom:12px"><span>Draft 1</span><span>70%</span></div><div style="height:46px;border-radius:23px;background:rgba(255,255,255,.15)"><div style="height:100%;width:70%;border-radius:23px;background:#D9BE74"></div></div><div style="font:400 26px Lexend;color:#EFDEE2;margin-top:10px">Most people quit here.</div></div><div><div style="display:flex;justify-content:space-between;font:500 30px Lexend;color:#FBF8F2;margin-bottom:12px"><span>Draft 2</span><span>88%</span></div><div style="height:46px;border-radius:23px;background:rgba(255,255,255,.15)"><div style="height:100%;width:88%;border-radius:23px;background:#EFDEE2"></div></div><div style="font:400 26px Lexend;color:#EFDEE2;margin-top:10px">“Here's what's off. Fix it.”</div></div><div><div style="display:flex;justify-content:space-between;font:500 30px Lexend;color:#FBF8F2;margin-bottom:12px"><span>Draft 3</span><span>97%</span></div><div style="height:46px;border-radius:23px;background:rgba(255,255,255,.15)"><div style="height:100%;width:97%;border-radius:23px;background:#FBF8F2"></div></div><div style="font:400 26px Lexend;color:#EFDEE2;margin-top:10px">Ready to send.</div></div>
</div></div></div>
<div class="foot"><span class="url">heidionclaude.com</span><span class="pill">Keep going →</span></div>
</body></html>
