<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=JetBrains+Mono:wght@400;500&display=swap"><style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px}
body{background:var(--bg);color:var(--ink);font-family:Lexend,sans-serif;position:relative;overflow:hidden}
.tag{position:absolute;top:56px;left:72px;right:72px;display:flex;justify-content:space-between;z-index:5;
  font:500 24px Lexend;letter-spacing:.22em;color:var(--lab);text-transform:uppercase}
.foot{position:absolute;left:72px;right:72px;bottom:56px;display:flex;justify-content:space-between;align-items:center;z-index:5;
  font:500 28px Lexend;color:var(--ink)}
.swipe{font:600 28px Lexend;color:var(--acc)}
.pill{font:600 34px Lexend;padding:24px 40px;border-radius:999px;background:var(--acc);color:var(--bg)}
.s{font-family:Newsreader,serif;font-weight:500;letter-spacing:-.02em;line-height:.98}
.s em{font-style:italic;font-weight:400;color:var(--acc)}
.l{font-family:Lexend,sans-serif}
.abs{position:absolute}
.card{background:#FBF8F2;color:#1A1816;border-radius:24px;box-shadow:0 30px 70px rgba(30,10,30,.25)}
.mark{background:linear-gradient(transparent 58%, rgba(160,70,111,.6) 58%, rgba(160,70,111,.6) 92%, transparent 92%);padding:0 6px}
.strike{position:relative;display:inline-block}
.strike:after{content:"";position:absolute;left:-8px;right:-8px;top:52%;height:14px;background:#A0466F;transform:rotate(-3deg)}
.stamp{border:10px solid #A0466F;color:#A0466F;border-radius:18px;font:700 80px Lexend;letter-spacing:.06em;padding:4px 30px;display:inline-block}
</style></head>
<body style="--bg:#1A1816;--ink:#F8F4ED;--acc:#D9BE74;--lab:#D9BE74;--card:#2A2622;--cink:#F8F4ED;--line:#B68A3E"><div class="tag"><span>Heidi on Claude</span><span>2 / 7</span></div>
<div class="abs s" style="left:72px;right:72px;top:150px;font-size:108px;color:#F8F4ED">Every saved prompt is <em>a decision you make again.</em></div><div class="abs card" style="left:72px;top:600px;padding:26px 34px;border-radius:40px;font:500 34px Lexend;color:#38203E;opacity:1">Which one was for emails?</div><div class="abs card" style="left:330px;top:740px;padding:26px 34px;border-radius:40px;font:500 34px Lexend;color:#38203E;opacity:0.85">Is this the new version?</div><div class="abs card" style="left:110px;top:880px;padding:26px 34px;border-radius:40px;font:500 34px Lexend;color:#38203E;opacity:0.7">Do I edit it first?</div><div class="abs card" style="left:300px;top:1020px;padding:26px 34px;border-radius:40px;font:500 34px Lexend;color:#38203E;opacity:0.55">Never mind. I'll write it myself.</div>
<div class="foot"><span>heidionclaude.com</span><span class="swipe">Swipe →</span></div></body></html>
